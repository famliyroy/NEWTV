name: moontv_client
description: NEWTV - a native Flutter client for a self-hosted MoonTVPlus server.
publish_to: 'none'
version: 0.1.9+10

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.0
  cookie_jar: ^4.0.8
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  path: ^1.9.0
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  cached_network_image: ^3.4.1
  package_info_plus: ^8.1.2
  window_manager: ^0.4.3
  intl: ^0.19.0
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
